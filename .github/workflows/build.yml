name: Build and Publish

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  # ── Linux (Snap Store) ───────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Snap
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Evaluated once at job level so the publish steps' `if:` can rely on it.
      # Publishing stays off until the SNAPCRAFT_STORE_CREDENTIALS secret exists.
      HAS_SNAP_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Electron binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
        key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-

    - name: Build Electron app (Snap)
      run: |
        for attempt in 1 2 3; do
          echo "Build attempt $attempt/3"
          if npm run electron:build; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Retrying after transient failure..."
            sleep 10
          fi
        done
        exit 1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Snap artifact
      uses: actions/upload-artifact@v4
      with:
        name: bible-app-snap
        path: dist/*.snap
        if-no-files-found: error

    - name: Locate Snap file
      id: snapfile
      # snapcore/action-publish takes a single file path, not a glob.
      run: |
        SNAP_PATH=$(ls dist/*.snap | head -n 1)
        echo "path=$SNAP_PATH" >> "$GITHUB_OUTPUT"

    - name: Publish to Snap Store (edge)
      if: >
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
        env.HAS_SNAP_CREDS == 'true'
      uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      with:
        snap: ${{ steps.snapfile.outputs.path }}
        release: edge

    - name: Publish to Snap Store (stable)
      if: >
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        env.HAS_SNAP_CREDS == 'true'
      uses: snapcore/action-publish@v1
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      with:
        snap: ${{ steps.snapfile.outputs.path }}
        release: stable

  # ── Windows (Microsoft Store via MSIX/AppX) ──────────────────────────────────
  build-windows:
    name: Build Windows AppX
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Evaluated once at job level so the publish steps' `if:` can rely on it.
      # Publishing stays off until the Store secrets exist.
      HAS_MS_STORE_CREDS: ${{ secrets.MS_STORE_TENANT_ID != '' && secrets.MS_STORE_PRODUCT_ID != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache Electron binaries
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\electron\Cache
          ~\AppData\Local\electron-builder\Cache
        key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-

    - name: Check Store identity values
      # The placeholders in package.json must be replaced with the values from
      # Partner Center > Product identity. Warn on normal builds; fail on
      # release tags so a placeholder identity is never shipped.
      shell: bash
      run: |
        node -e "
          const a = require('./package.json').build.appx;
          const placeholder = a.identityName === 'karaniph.BibleApp' || a.publisher === 'CN=karaniph';
          if (!placeholder) { console.log('Store identity values are set.'); process.exit(0); }
          const msg = 'build.appx identityName/publisher are still placeholders. Replace them with the values from Partner Center > Product identity.';
          if ((process.env.GITHUB_REF || '').startsWith('refs/tags/v')) { console.log('::error::' + msg); process.exit(1); }
          console.log('::warning::' + msg);
        "

    - name: Build Electron app (AppX)
      # Unsigned on purpose: the Microsoft Store re-signs packages it accepts.
      run: npm run electron:build:win

    - name: Upload AppX artifact
      uses: actions/upload-artifact@v4
      with:
        name: bible-app-appx
        path: dist/*.appx
        if-no-files-found: error

    # ── Publish to Microsoft Store (official Microsoft Store Developer CLI) ──
    # PREREQUISITE: the app must already be published and live in the Store.
    # The first submission is uploaded by hand in Partner Center.
    #
    # Repository secrets:
    #   MS_STORE_TENANT_ID, MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID,
    #   MS_STORE_CLIENT_SECRET, MS_STORE_PRODUCT_ID (Store ID, e.g. 9NXXXXXXXXXX)
    - name: Set up Microsoft Store CLI
      if: >
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        env.HAS_MS_STORE_CREDS == 'true'
      uses: microsoft/microsoft-store-apppublisher@v1.4

    - name: Publish to Microsoft Store
      if: >
        github.event_name == 'push' &&
        startsWith(github.ref, 'refs/tags/v') &&
        env.HAS_MS_STORE_CREDS == 'true'
      shell: pwsh
      run: |
        msstore reconfigure `
          --tenantId "${{ secrets.MS_STORE_TENANT_ID }}" `
          --sellerId "${{ secrets.MS_STORE_SELLER_ID }}" `
          --clientId "${{ secrets.MS_STORE_CLIENT_ID }}" `
          --clientSecret "${{ secrets.MS_STORE_CLIENT_SECRET }}"
        $pkg = Get-ChildItem -Path dist -Filter *.appx | Select-Object -First 1
        if (-not $pkg) { throw "No .appx found in dist/" }
        msstore publish $pkg.FullName -id "${{ secrets.MS_STORE_PRODUCT_ID }}"
